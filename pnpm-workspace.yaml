packages:
  - 'apps/*'
  - 'packages/*'

# Skia ships prebuilt native binaries and needs its install script to run.
# PLAN.md §4 already picks Skia for the charts and body map.
allowBuilds:
  '@shopify/react-native-skia': true
  # tsx pulls esbuild in for the figures script. Its postinstall only fetches a
  # platform binary that the optional dependency already provides, and `pnpm
  # figures` runs without it, so the script stays off.
  esbuild: false
